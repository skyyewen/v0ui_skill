interface:
  display_name: "V0 UI"
  short_description: "Build Vercel-like neutral SaaS UI with soft text, near-white surfaces, semantic colorful icons, and strict design constraints."
  default_prompt: "Use $v0ui to build or refine a frontend with Vercel-like minimal SaaS constraints: #fafafa-like near-white background, #261b17-like strong text, #575757-like body/navigation text, neutral panels, generous whitespace, pure-black filled controls reserved for truly primary actions, light neutral selected states for sidebars, tabs, steps, filters, badges, and status chips, small semantic colorful accents for statuses, project avatars, product marks, charts, progress, warnings, success, errors, and AI actions, smooth transitions, strong interaction feedback, React/Next.js, Tailwind, local shadcn-compatible UI components, Radix state transitions, complete states, and rendered verification."
