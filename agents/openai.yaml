interface:
  display_name: "V0 UI"
  short_description: "Build minimal commercial SaaS UI with clean white surfaces, quiet navigation states, restrained accents, and strict design constraints."
  default_prompt: "Use $v0ui to build or refine a frontend with minimal commercial SaaS constraints: white background, black or near-black text, neutral panels, generous whitespace, pure-black filled controls reserved for truly primary actions, light neutral selected states for sidebars, tabs, steps, filters, badges, and status chips, restrained color accents at important points, smooth transitions, strong interaction feedback, React/Next.js, Tailwind, local shadcn-compatible UI components, Radix state transitions, complete states, and rendered verification."
